# Release pipeline for the App Server executable (ATC-127).
#
# Two channels, one pipeline, both manual dispatch (mise run
# app-server:release:dev / app-server:release:stable) — dev releases are
# on-demand, not on-merge, so both surfaces share one mental model (the
# macOS DMG can only build on-demand: signing lives on the developer Mac):
#
#   dev     rebuilds the single rolling `dev` prerelease: the tag is force-
#           moved, the release recreated, so exactly one dev build exists.
#           Versions stamp as <next-patch>-dev.<UTC minute> so `atc --version`
#           is self-describing and sorts below the next stable release.
#   stable  tags vX.Y.Z (bumped from the highest existing v tag per
#           release_type) and publishes a GitHub Release. `releases/latest`
#           only ever points here — prereleases are excluded — so
#           install.sh's stable channel needs no manifest.
#
# Darwin targets build on macOS so Bun's ad-hoc code signature is applied
# (and verified) natively; Linux targets cross-compile on ubuntu. Three of
# the four targets are validated natively with the compiled black-box suite
# against the release-built binary — darwin-x64 is compile-only best-effort
# (GitHub's free Intel macOS runners are retired). Tags are only pushed
# after every build and validation job has passed.
name: App Server Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel: rolling dev prerelease or stable vX.Y.Z"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - stable
      release_type:
        description: "Stable release version bump"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

# One release at a time: two stable dispatches would compute the same tag,
# and two dev runs would race the rolling tag.
concurrency:
  group: app-server-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: app-server

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute channel and version
        id: version
        run: |
          channel="${{ inputs.channel }}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          if [ "$channel" = "stable" ]; then
            if [ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]; then
              echo "stable releases must run from ${{ github.event.repository.default_branch }}; use channel=dev for branch builds" >&2
              exit 1
            fi
            tag="$(scripts/next-version.sh "${{ inputs.release_type }}")"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            next="$(scripts/next-version.sh patch)"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "version=${next#v}-dev.$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi

  build-darwin:
    needs: plan
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: app-server

      - name: Build darwin targets
        run: |
          mise run install
          bun run scripts/build.ts --version=${{ needs.plan.outputs.version }} --channel=${{ needs.plan.outputs.channel }} darwin-arm64 darwin-x64

      # Bun applies an ad-hoc signature at compile time; verify it, and
      # re-sign in place if a Bun upgrade ever stops doing so.
      - name: Verify ad-hoc signatures
        run: |
          for target in darwin-arm64 darwin-x64; do
            codesign --verify --strict "dist/atc-$target" || codesign --force -s - "dist/atc-$target"
            codesign --verify --strict "dist/atc-$target"
          done

      - name: Verify version stamp
        run: test "$(dist/atc-darwin-arm64 --version)" = "atc v${{ needs.plan.outputs.version }}"

      - name: Compiled black-box tests (native arm64)
        run: ATC_COMPILED_BIN="$PWD/dist/atc-darwin-arm64" bun --bun vitest run test/compiled.blackbox.test.ts

      - name: Package tarballs
        run: |
          mkdir -p out
          for target in darwin-arm64 darwin-x64; do
            staging="$(mktemp -d)"
            cp "dist/atc-$target" "$staging/atc"
            tar -czf "out/atc-$target.tar.gz" -C "$staging" atc
          done
          (cd out && shasum -a 256 *.tar.gz > checksums-darwin.txt)

      - uses: actions/upload-artifact@v6
        with:
          name: atc-darwin
          path: app-server/out/*
          if-no-files-found: error

  build-linux:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: app-server

      - name: Build linux targets
        run: |
          mise run install
          bun run scripts/build.ts --version=${{ needs.plan.outputs.version }} --channel=${{ needs.plan.outputs.channel }} linux-x64 linux-arm64

      - name: Standing gates (fmt, typecheck, tests, drift)
        run: mise run check

      - name: Verify version stamp
        run: test "$(dist/atc-linux-x64 --version)" = "atc v${{ needs.plan.outputs.version }}"

      - name: Compiled black-box tests (native x64)
        run: ATC_COMPILED_BIN="$PWD/dist/atc-linux-x64" bun --bun vitest run test/compiled.blackbox.test.ts

      - name: Package tarballs
        run: |
          mkdir -p out
          for target in linux-x64 linux-arm64; do
            staging="$(mktemp -d)"
            cp "dist/atc-$target" "$staging/atc"
            tar -czf "out/atc-$target.tar.gz" -C "$staging" atc
          done
          (cd out && sha256sum *.tar.gz > checksums-linux.txt)

      - uses: actions/upload-artifact@v6
        with:
          name: atc-linux
          path: app-server/out/*
          if-no-files-found: error

  # Native validation of the cross-compiled arm64 binary, from the packaged
  # tarball — this also proves the archive layout install.sh relies on.
  validate-linux-arm:
    needs: build-linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: app-server

      - uses: actions/download-artifact@v7
        with:
          name: atc-linux
          path: app-server/out

      - name: Compiled black-box tests (native arm64, extracted tarball)
        run: |
          mise run install
          tar -xzf out/atc-linux-arm64.tar.gz -C out
          ATC_COMPILED_BIN="$PWD/out/atc" bun --bun vitest run test/compiled.blackbox.test.ts

  release:
    needs: [plan, build-darwin, build-linux, validate-linux-arm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: app-server/release
          merge-multiple: true

      - name: Merge checksums
        run: |
          cd release
          cat checksums-*.txt | sort -k2 > checksums.txt
          rm checksums-*.txt
          ls -l

      # Exactly one dev release exists: the previous one is deleted, the tag
      # force-moved to this commit, and the release recreated as a prerelease
      # (which keeps it out of releases/latest, the stable-channel URL).
      - name: Publish rolling dev prerelease
        if: needs.plan.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev --yes || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev
          git push -f origin dev
          gh release create dev release/*.tar.gz release/checksums.txt \
            --prerelease \
            --title "dev (${{ needs.plan.outputs.version }})" \
            --notes "$(printf 'Rolling dev-channel build of commit %s.\n\nInstall or update:\n\n    curl -fsSL https://raw.githubusercontent.com/%s/main/install.sh | sh -s -- --channel dev\n\nInstalled builds update with `atc upgrade`.' "$GITHUB_SHA" "$GITHUB_REPOSITORY")"

      - name: Publish stable GitHub release
        if: needs.plan.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.plan.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          gh release create "$tag" release/*.tar.gz release/checksums.txt \
            --title "$tag" \
            --notes "$(printf 'Install or update:\n\n    curl -fsSL https://raw.githubusercontent.com/%s/main/install.sh | sh\n\nThen run `atc service install` to start it as a login service. Installed builds update with `atc upgrade`.' "$GITHUB_REPOSITORY")"
