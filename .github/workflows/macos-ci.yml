name: macOS CI

# Runs on every PR so the required `macos-ci-ok` check always reports.
# Path awareness lives at the job level (the `changes` job): a required check
# from a workflow-level path filter would hang pending on non-matching PRs.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "macos/**"
      - "packages/**"
      - "app-server/openapi.json"
      - "scripts/**"
      - "mise.toml"
      - ".github/workflows/macos-ci.yml"
      - ".github/workflows/product-release.yml"

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this PR touches the Swift surfaces. Push events are
  # already path-filtered at the workflow level, so they always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ github.event_name == 'push' || steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            relevant:
              - "macos/**"
              - "packages/**"
              # The ATCAppServerAPI Swift client is generated from this
              # artifact at build time, so contract changes must rebuild the
              # Swift surfaces.
              - "app-server/openapi.json"
              - "scripts/**"
              - "mise.toml"
              - ".github/workflows/macos-ci.yml"
              - ".github/workflows/product-release.yml"

  # SwiftLint ships official Linux binaries, so linting runs on a cheap
  # runner while the macOS jobs spin up.
  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: SwiftLint
        run: mise run swift:lint

  # Both macOS jobs cache packages/ATCKit/.build keyed on Package.resolved:
  # SPM source checkouts plus build products, which SPM keeps incrementally
  # correct (unlike DerivedData, which is never cached here). The app job
  # needs it too — prepare-xcode-openapi.sh compiles swift-openapi-generator
  # out of that directory before xcodebuild starts.
  kit:
    name: ATCKit tests + swift-format
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      # CI-only: compiler warnings in our targets fail the build. Locally the
      # tasks stay permissive so a new Xcode deprecation can't block iteration.
      ATC_STRICT_WARNINGS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v5
        with:
          path: packages/ATCKit/.build
          key: spm-kit-${{ runner.os }}-${{ hashFiles('packages/ATCKit/Package.resolved') }}
          restore-keys: spm-kit-${{ runner.os }}-

      # Same commands as local `mise run swift:fmt:check` / `kit:test`.
      - name: swift-format check
        run: mise run swift:fmt:check

      - name: ATCKit tests
        run: mise run kit:test

  app:
    name: macOS app tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      ATC_STRICT_WARNINGS: "1"
      # Pins where xcodebuild clones SPM dependencies so the checkout cache
      # below has a stable path (DerivedData itself stays per-run).
      ATC_XCODE_SPM_DIR: ${{ github.workspace }}/.spm-packages
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v5
        with:
          path: packages/ATCKit/.build
          key: spm-kit-${{ runner.os }}-${{ hashFiles('packages/ATCKit/Package.resolved') }}
          restore-keys: spm-kit-${{ runner.os }}-

      - uses: actions/cache@v5
        with:
          path: .spm-packages
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('macos/atc.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-

      - name: Show Xcode version
        run: xcodebuild -version

      # Same command as local `mise run macos:test`.
      - name: macOS app tests
        run: mise run macos:test

  # The single required check for this workflow: reports on every PR (skipped
  # upstream jobs are fine, failed or cancelled ones are not), so the `main`
  # ruleset can require it without hanging non-matching PRs.
  ci-ok:
    name: macos-ci-ok
    needs: [changes, lint, kit, app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
