name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run check

  supervisor:
    # The real-supervisor regression (ATC-319): real systemd user manager,
    # real zmx, isolated ATC state. Prerequisites missing fail the job —
    # the test that proves terminals survive a server stop must never
    # silently skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Install zmx
        env:
          ZMX_VERSION: "0.6.0"
        run: |
          curl -fsSL -o zmx.tar.gz "https://github.com/neurosnap/zmx/releases/download/v${ZMX_VERSION}/zmx-${ZMX_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o zmx.tar.gz.sha256 "https://github.com/neurosnap/zmx/releases/download/v${ZMX_VERSION}/zmx-${ZMX_VERSION}-linux-x86_64.tar.gz.sha256"
          echo "$(cut -d' ' -f1 zmx.tar.gz.sha256)  zmx.tar.gz" | sha256sum -c -
          tar -xzf zmx.tar.gz
          sudo install -m 0755 zmx /usr/local/bin/zmx
          zmx version
      - name: Reach the systemd user manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Verify the prerequisites
        run: |
          for _ in $(seq 1 50); do
            systemctl --user show --property=Version --value && break
            sleep 0.2
          done
          systemctl --user show --property=Version --value
          systemd-run --version | head -n 1
      - run: ATC_SUPERVISOR_TESTS=require go test -race -count=1 -v -run 'RealSupervisor|RealScope|RealZmx' ./internal/...
