name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run check

  supervisor:
    # The real-supervisor regression (ATC-319) plus the managed-runtime
    # lifecycle (ATC-324): real systemd user manager and isolated ATC
    # state, with ATC installing the pinned zmx itself — no zmx is placed
    # on PATH, since nothing consults it. Prerequisites missing fail the
    # job: the tests that prove terminals survive a stop and that the
    # pinned assets are real must never silently skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Reach the systemd user manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Verify the prerequisites
        run: |
          for _ in $(seq 1 50); do
            systemctl --user show --property=Version --value && break
            sleep 0.2
          done
          systemctl --user show --property=Version --value
          systemd-run --version | head -n 1
      - run: ATC_SUPERVISOR_TESTS=require go test -race -count=1 -v -run 'RealSupervisor|RealScope|RealZmx|PinnedAssets' ./internal/...

  runtime-macos:
    # macOS parity for the managed runtime (ATC-324): Linux results do not
    # establish it. No systemd here, so the supervisor tests skip; the
    # real-zmx lifecycle installs and runs the pinned macOS arm64 asset,
    # and the asset-validation test checks every target's pins.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: ATC_SUPERVISOR_TESTS=require go test -race -count=1 -v -run 'RealZmx|PinnedAssets' ./internal/integrations/zmx/
