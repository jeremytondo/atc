name: App Server CI

# Runs on every PR so the required `app-server-ci-ok` check always reports.
# Path awareness lives at the job level (the `changes` job): a required check
# from a workflow-level path filter would hang pending on non-matching PRs.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "app-server/**"
      - "mise.toml"
      - "install.sh"
      - ".github/workflows/app-server-ci.yml"

permissions:
  contents: read

concurrency:
  group: app-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this PR touches the App Server surface. Push events are
  # already path-filtered at the workflow level, so they always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ github.event_name == 'push' || steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            relevant:
              - "app-server/**"
              - "mise.toml"
              - "install.sh"
              - ".github/workflows/app-server-ci.yml"

  validate:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-server
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: app-server

      # Same gates as local `mise run check`: frozen-lockfile install,
      # Prettier format check, strict tsc, the vitest suite (black-box
      # serve/shutdown and CLI tests over loopback TCP, client integration
      # tests), and OpenAPI drift detection (openapi.json must match the
      # contract).
      - name: Check
        run: mise run check

      # The root install script has no test suite; at least keep it parseable.
      - name: Syntax-check install.sh
        run: sh -n ../install.sh

  # Proves all four release targets compile. Cross-compilation alone says
  # nothing about runtime behavior — that is what native-validate is for.
  cross-compile:
    name: cross-compile (build only, no runtime validation)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-server
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: app-server

      - name: Build all targets
        run: mise run build:all

      - name: Verify deterministic artifact names
        # Keep this target list in sync with TARGETS in app-server/scripts/build.ts.
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            test -x "dist/atc-$target" || { echo "missing dist/atc-$target"; exit 1; }
          done

  # Native runtime validation of the compiled artifact: macOS arm64 and
  # Linux x64 on hosted runners. The other two targets are cross-compile-only
  # until the release/packaging milestone adds native coverage.
  native-validate:
    name: native compiled validation (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-server
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: app-server

      # The fast suite exercises the OS-sensitive subprocess seam (process
      # groups, signal escalation), so run it natively on both platforms too.
      - name: Fast suite
        run: mise run test

      - name: Compiled artifact black-box tests
        run: mise run test:compiled

  # The single required check for this workflow: reports on every PR (skipped
  # upstream jobs are fine, failed or cancelled ones are not), so the `main`
  # ruleset can require it without hanging non-matching PRs.
  ci-ok:
    name: app-server-ci-ok
    needs: [changes, validate, cross-compile, native-validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
