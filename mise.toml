# Repo-wide task runner. Each surface keeps its own tooling and stays
# independently buildable; these tasks fan out so one command answers
# "is the repo healthy?" the same way locally and in CI.

[tools]
swiftlint = "0.65.0"

# --- Primary entrypoints ---

[tasks.dev]
description = "Run the App Server in the foreground (http://127.0.0.1:7331)"
run = "mise run -C app-server dev"

[tasks.install]
description = "Build the App Server and install it as the local atc binary (default: ~/.local/bin/atc)"
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run -C app-server build
case "$(uname -m)" in
  arm64|aarch64) arch=arm64 ;;
  x86_64) arch=x64 ;;
  *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
esac
os="$(uname -s | tr '[:upper:]' '[:lower:]')"
dir="${ATC_INSTALL_DIR:-$HOME/.local/bin}"
mkdir -p "$dir"
install -m 0755 "app-server/dist/atc-$os-$arch" "$dir/atc"
# --version is the binary's own build stamp; `atc version` would ask a
# running server and fail when none is up.
echo "installed $dir/atc ($("$dir/atc" --version))"
"""

[tasks.check]
description = "All gates: App Server check, Swift lint, Kit tests, macOS app tests"
depends = ["app-server:check", "swift:lint", "kit:test", "macos:test"]

[tasks.test]
description = "All tests: App Server, ATCKit, macOS app"
depends = ["app-server:test", "kit:test", "macos:test"]

# --- App Server (TypeScript/Effect on Bun) ---

[tasks."app-server:check"]
description = "App Server format check, strict type check, tests, OpenAPI drift"
run = "mise run -C app-server check"

[tasks."app-server:test"]
description = "App Server test suite"
run = "mise run -C app-server test"

[tasks."app-server:openapi"]
description = "Regenerate the checked-in App Server OpenAPI artifact from the contract"
run = "mise run -C app-server openapi"

# The full contract pipeline after a contract change: regenerate with
# app-server:openapi, then this verifies OpenAPI drift and client integration
# tests (app-server:check) and compiles/tests the generated Swift client
# (kit:test).
[tasks."contract:check"]
description = "Verify the API contract end to end: drift, TS client tests, Swift client build"
depends = ["app-server:check", "kit:test"]

[tasks."app-server:build"]
description = "Compile the standalone App Server atc executable for this machine"
run = "mise run -C app-server build"

[tasks."app-server:build:all"]
description = "Cross-compile standalone App Server atc executables for every release target"
run = "mise run -C app-server 'build:all'"

# --- Swift surfaces ---

# SwiftLint covers macos/ and packages/ATCKit per .swiftlint.yml; the pinned
# binary comes from mise ([tools]), so CI and local runs agree.
[tasks."swift:lint"]
description = "SwiftLint over the Swift surfaces (strict: warnings fail)"
run = "swiftlint lint --strict --quiet"

[tasks."swift:lint:fix"]
description = "Apply SwiftLint autocorrections"
run = "swiftlint lint --fix --quiet"

# ATC_STRICT_WARNINGS=1 (set in CI) promotes compiler warnings to errors in
# our targets only — SPM suppresses dependency warnings. Local runs stay
# permissive so an Xcode upgrade that newly deprecates an API cannot block
# iteration mid-refactor.
[tasks."kit:test"]
description = "ATCKit package tests (ATC_STRICT_WARNINGS=1 fails on compiler warnings)"
dir = "packages/ATCKit"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "${ATC_STRICT_WARNINGS:-0}" = "1" ]; then
  swift test -Xswiftc -warnings-as-errors
else
  swift test
fi
"""

[tasks."macos:test"]
description = "macOS app tests (signing disabled so any machine/CI can run them; ATC_STRICT_WARNINGS=1 fails on compiler warnings)"
# -skipPackagePluginValidation: the ATCAppServerAPI client is generated by the
# Swift OpenAPI Generator build plugin, which xcodebuild refuses to run until
# trusted; the plugin is version-pinned in ATCKit's Package.swift.
run = """
#!/usr/bin/env bash
set -euo pipefail

derived_data_path="$(mktemp -d "${TMPDIR:-/tmp}/atc-macos-test.XXXXXX")"
trap 'rm -rf "$derived_data_path"' EXIT

# ATC_SWIFT_STRICT_WARNINGS feeds the indirection in project.pbxproj: only
# this project's targets reference it, so a global SWIFT_TREAT_WARNINGS_AS_
# ERRORS override cannot break Swift package dependencies.
strict_settings=""
if [ "${ATC_STRICT_WARNINGS:-0}" = "1" ]; then
  strict_settings="ATC_SWIFT_STRICT_WARNINGS=YES"
fi

scripts/prepare-xcode-openapi.sh "$derived_data_path"
# $strict_settings intentionally unquoted: empty must vanish, not become "".
xcodebuild test \
  -project macos/atc.xcodeproj \
  -scheme atc \
  -destination platform=macOS \
  -derivedDataPath "$derived_data_path" \
  -skipPackagePluginValidation \
  CODE_SIGNING_ALLOWED=NO $strict_settings
"""

[tasks.refs]
description = "Fetch read-only reference source into repos/ (gitignored); delete a checkout and re-run to update"
run = """
#!/usr/bin/env bash
set -euo pipefail
clone() {
  if [ -d "repos/$1" ]; then
    echo "repos/$1 already present; delete it and re-run to update"
  else
    git clone --depth 1 "${@:2}" "repos/$1"
  fi
}
# Keep the Effect tag in sync with the version pinned in app-server.
clone effect --branch 'effect@4.0.0-beta.102' https://github.com/Effect-TS/effect.git
clone t3code https://github.com/pingdotgg/t3code.git
clone opencode https://github.com/sst/opencode.git
# Keep the zmx tag in sync with the installed zmx binary (brew info zmx).
clone zmx --branch 'v0.6.0' https://github.com/neurosnap/zmx.git
"""

# --- Releases ---
# One mental model: release:<channel> releases the whole product;
# <surface>:release:<channel> releases one surface. Nothing publishes on
# merge — a release happens only when you run its task. The App Server tasks
# dispatch the GitHub Actions pipeline
# (.github/workflows/app-server-release.yml); the macOS tasks build,
# notarize, and upload locally (signing lives on the developer Mac).

[tasks."release:dev"]
description = "Full dev release: App Server in CI + macOS DMG locally, in parallel (add --verbose for full macOS logs)"
run = "scripts/release.sh dev"

[tasks."release:stable"]
description = "Full stable release: cut vX.Y.Z in CI, then attach the macOS DMG (usage: mise run release:stable [patch|minor|major] [--verbose])"
run = "scripts/release.sh stable"

[tasks."app-server:release:stable"]
description = "Dispatch the stable App Server release (usage: mise run app-server:release:stable [patch|minor|major])"
run = """
#!/usr/bin/env bash
set -euo pipefail
bump="${1:-patch}"
case "$bump" in
  patch|minor|major) ;;
  *) echo "usage: mise run app-server:release:stable [patch|minor|major]" >&2; exit 1 ;;
esac
gh workflow run app-server-release.yml -f channel=stable -f release_type="$bump"
echo "dispatched stable release ($bump bump); follow with: gh run watch"
"""

[tasks."app-server:release:dev"]
description = "Build and publish the rolling dev-channel App Server release"
run = [
  "gh workflow run app-server-release.yml -f channel=dev",
  "echo 'dispatched dev release; follow with: gh run watch'",
]

[tasks."macos:release:stable"]
description = "Build, notarize, and attach the stable macOS DMG to the latest vX.Y.Z release (add --verbose for full logs)"
run = "scripts/release-macos.sh --channel stable --upload"

[tasks."macos:release:dev"]
description = "Build and publish a notarized dev DMG to GitHub Releases (add --verbose for full logs)"
run = "scripts/release-macos.sh --channel dev --upload"

