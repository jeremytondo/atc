[tools]
go = "1.26.7"

[tasks.build]
description = "Build a static atc binary into bin/"
run = "CGO_ENABLED=0 go build -o bin/atc ./cmd/atc"

[tasks.test]
description = "Run tests with the race detector"
run = "go test -race ./..."

# gofmt has no module awareness, so scope it to the root module's packages;
# this keeps experiments/ and repos/ out without a hand-maintained list.
[tasks.lint]
description = "Check gofmt on root-module packages"
shell = "bash -c"
run = '''
{% raw %}
set -euo pipefail
unformatted="$(go list -f '{{.Dir}}' ./... | while IFS= read -r dir; do gofmt -l "$dir" || exit 1; done)"
if [ -n "$unformatted" ]; then
  echo "gofmt required on:"
  echo "$unformatted"
  exit 1
fi
{% endraw %}
'''

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.check]
description = "Build, lint, vet, and test"
depends = ["build", "lint", "vet", "test"]

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin"

[tasks.refs]
description = "Fetch read-only reference source into repos/ (gitignored); delete a checkout and re-run to update"
run = """
#!/usr/bin/env bash
set -euo pipefail
clone() {
  if [ -d "repos/$1" ]; then
    echo "repos/$1 already present; delete it and re-run to update"
  else
    git clone --depth 1 "${@:2}" "repos/$1"
  fi
}
clone t3code https://github.com/pingdotgg/t3code.git
clone herdr https://github.com/herdrdev/herdr.git
clone agent-client-protocol https://github.com/agentclientprotocol/agent-client-protocol.git
clone zmx --branch 'v0.6.0' https://github.com/neurosnap/zmx.git
"""
