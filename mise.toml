[tools]
go = "1.26.7"
golangci-lint = "2.13.1"
goreleaser = "2.17.1"
# The artifact platform's pinned runtime (internal/authoring), for the
# platform check; atc itself provisions this version privately at
# authoring time.
node = "24.21.0"
sqlc = "1.31.1"

[tasks.build]
description = "Build a static atc binary into bin/"
run = "CGO_ENABLED=0 go build -o bin/atc ./cmd/atc"

[tasks.test]
description = "Run tests with the race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Run golangci-lint (includes gofmt and go vet)"
run = "golangci-lint run ./..."

[tasks.generate]
description = "Regenerate sqlc query code in internal/store"
run = "sqlc generate -f internal/store/sqlc.yaml"

[tasks."generate:check"]
description = "Fail when sqlc-generated code is stale (run mise generate)"
run = "sqlc diff -f internal/store/sqlc.yaml"

[tasks."platform:check"]
description = "Type-check and build the artifact platform and its examples (internal/authoring/platform)"
dir = "internal/authoring/platform"
run = '''
#!/usr/bin/env bash
# Each example is checked in a scratch copy of the project so the tracked
# starter document is never touched.
set -euo pipefail
npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
npx tsc --noEmit -p tsconfig.json
npx vite build --logLevel warn
# The document origin pins only "./"-relative references and serves under a
# CSP that forbids inline scripts: the build must keep emitting that shape.
if grep -qE 'src="/|href="/' dist/index.html || grep -E '<script' dist/index.html | grep -qv 'src="\./'; then
  echo "dist/index.html must reference assets with ./ paths and carry no inline script" >&2
  exit 1
fi
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
for example in examples/*/; do
  project="$scratch/$(basename "$example")"
  mkdir -p "$project/src"
  cp package.json package-lock.json index.html vite.config.ts tsconfig.json "$project/"
  cp -R src/main.tsx src/platform "$project/src/"
  cp -R "$example" "$project/src/document"
  ln -s "$PWD/node_modules" "$project/node_modules"
  (cd "$project" && npx tsc --noEmit -p tsconfig.json && npx vite build --logLevel warn)
done
'''

[tasks.check]
description = "Build, lint, generate-check, platform-check, and test"
depends = ["build", "lint", "generate:check", "platform:check", "test"]

[tasks.install]
description = "Build a static atc binary into ~/.local/bin"
run = "mkdir -p ~/.local/bin && CGO_ENABLED=0 go build -o ~/.local/bin/atc ./cmd/atc"

[tasks."release:patch"]
description = "Dispatch the release workflow to cut a patch release"
run = "gh workflow run release.yml -f bump=patch"

[tasks."release:minor"]
description = "Dispatch the release workflow to cut a minor release"
run = "gh workflow run release.yml -f bump=minor"

[tasks."release:major"]
description = "Dispatch the release workflow to cut a major release"
run = "gh workflow run release.yml -f bump=major"

[tasks."release:dev"]
description = "Refresh the rolling dev build from main (pass --ref <branch> to build a pushed branch)"
run = "gh workflow run release.yml -f bump=dev"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin"

[tasks.refs]
description = "Fetch read-only reference source into repos/ (gitignored); delete a checkout and re-run to update"
run = """
#!/usr/bin/env bash
set -euo pipefail
clone() {
  if [ -d "repos/$1" ]; then
    echo "repos/$1 already present; delete it and re-run to update"
  else
    git clone --depth 1 "${@:2}" "repos/$1"
  fi
}
clone t3code https://github.com/pingdotgg/t3code.git
clone herdr https://github.com/herdrdev/herdr.git
clone agent-client-protocol https://github.com/agentclientprotocol/agent-client-protocol.git
clone zmx --branch 'v0.6.0' https://github.com/neurosnap/zmx.git
"""
