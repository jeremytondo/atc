[tools]
bun = "1.3.14"

# --- Primary entrypoints ---

[tasks.dev]
description = "Run the App Server in the foreground (http://127.0.0.1:7331)"
depends = ["install"]
run = "bun run src/main.ts serve"

[tasks.check]
description = "All App Server gates: format check, lint, strict type check, tests, OpenAPI and admin UI checks"
depends = ["fmt:check", "lint", "typecheck", "test", "openapi:check", "web:check", "web:assets:check"]

[tasks.build]
description = "Compile the standalone atc executable for this machine into dist/"
depends = ["install"]
run = "bun run scripts/build.ts"

[tasks."build:all"]
description = "Cross-compile standalone atc executables for every release target into dist/"
depends = ["install"]
run = "bun run scripts/build.ts --all"

# --- Building blocks ---

# fmt:check/typecheck/test share install as a dependency instead of each
# installing themselves: mise runs tasks in parallel, and concurrent installs
# into the same node_modules race. A shared dependency runs exactly once.
[tasks.install]
description = "Install dependencies from the committed lockfile"
run = "bun install --frozen-lockfile"

[tasks.openapi]
description = "Regenerate the checked-in OpenAPI artifact (openapi.json) from the contract"
depends = ["install"]
run = "bun run scripts/openapi.ts"

[tasks."openapi:check"]
description = "Fail if openapi.json is stale relative to the contract"
depends = ["install"]
run = "bun run scripts/openapi.ts --check"

[tasks.fmt]
description = "Format TypeScript, JSON, and Markdown with Prettier"
depends = ["install"]
run = "bun run prettier --write ."

[tasks."fmt:check"]
description = "Fail if any file is not Prettier-clean"
depends = ["install"]
run = "bun run prettier --check ."

[tasks.typecheck]
description = "Strict TypeScript type check (no emit)"
depends = ["install"]
run = "bun run tsc --noEmit"

# Semantic lint: oxlint categories plus the ATC plugin rules (lint/) that
# enforce the AGENTS.md invariants. Svelte files are excluded in
# .oxlintrc.json — oxlint's .svelte script-block analysis can't see template
# bindings (false positives), so svelte-check (web:check) owns that surface.
[tasks.lint]
description = "Lint TypeScript with oxlint, including the ATC plugin rules"
depends = ["install"]
run = "bun run oxlint --report-unused-disable-directives --deny-warnings"

[tasks."lint:fix"]
description = "Apply oxlint autofixes"
depends = ["install"]
run = "bun run oxlint --fix --report-unused-disable-directives"

# --bun forces the Bun runtime (vitest's shebang would otherwise pick node),
# so tests exercise the same runtime the server ships on.
[tasks.test]
description = "Run the vitest suite on the Bun runtime"
depends = ["install"]
run = "bun --bun vitest run"

# --- Admin UI (web/) ---

# The built UI (web/build) and its embed manifest are committed, so the
# server binary and its runtime never need a web toolchain. The standing
# check task does: web:check (svelte-check) type-checks web/src, installing
# the web dev dependencies via web:install. The remaining tradeoff is that
# web:assets:check only verifies manifest <-> web/build consistency — nothing
# detects an edited web/src whose build was never rerun. Run web:build after
# changing web/src and commit the result.

# dir (not bun's --cwd, which silently no-ops on relative paths): each task
# runs inside web/ with its own package.json and lockfile.

[tasks."web:install"]
description = "Install admin UI dependencies from the committed lockfile"
dir = "web"
run = "bun install --frozen-lockfile"

[tasks."web:dev"]
description = "Run the admin UI dev server (proxies /api to a running App Server)"
depends = ["web:install"]
dir = "web"
run = "bun run dev"

[tasks."web:build"]
description = "Build the admin UI into web/build and regenerate the embed manifest"
depends = ["web:install"]
dir = "web"
run = ["bun run build", "bun run ../scripts/adminAssets.ts"]

[tasks."web:check"]
description = "Type-check the admin UI source (svelte-check)"
depends = ["web:install"]
dir = "web"
run = "bun run check"

[tasks."web:assets:check"]
description = "Fail if the embed manifest is stale relative to web/build"
run = "bun run scripts/adminAssets.ts --check"

[tasks."test:compiled"]
description = "Black-box tests of the compiled artifact (builds the host target first)"
depends = ["build"]
run = "ATC_COMPILED_TEST=1 bun --bun vitest run test/compiled.blackbox.test.ts"

[tasks."test:smoke"]
description = "Opt-in live provider smoke tests (requires Codex CLI and Claude Code credentials)"
depends = ["build"]
run = "ATC_SMOKE=1 bun --bun vitest run test/agents/provider.smoke.test.ts test/agents/codexAdapter.smoke.test.ts test/agents/claudeAdapter.smoke.test.ts test/agents/claudeTui.smoke.test.ts"

[tasks."test:zmx"]
description = "Opt-in tests against the real installed zmx: adapter smoke and compiled restart recovery"
depends = ["build"]
run = "ATC_ZMX_SMOKE=1 bun --bun vitest run test/terminals/zmxSmoke.test.ts test/terminals/zmxRecovery.blackbox.test.ts"
