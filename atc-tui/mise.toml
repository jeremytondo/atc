[tools]
bun = "1.3.14"

[tasks.dev]
description = "Run the terminal-native ATC client from source"
depends = ["deps"]
run = "bun run src/main.ts"

[tasks.check]
description = "Format, lint, type, test, and standalone build gates"
depends = ["fmt:check", "lint", "typecheck", "test", "build"]

[tasks.build]
description = "Compile the standalone atc-tui executable for this machine"
depends = ["deps"]
run = "bun build --compile --no-compile-autoload-dotenv --no-compile-autoload-bunfig --outfile=dist/atc-tui src/main.ts"

[tasks.install]
description = "Build and install atc-tui under ATC_INSTALL_DIR (defaults to ~/.local/bin)"
depends = ["build"]
run = '''
install_dir="${ATC_INSTALL_DIR:-$HOME/.local/bin}"
mkdir -p "$install_dir"
install -m 0755 dist/atc-tui "$install_dir/atc-tui"
echo "installed atc-tui to $install_dir/atc-tui"
'''

[tasks.deps]
description = "Install TUI and imported App Server source dependencies from committed lockfiles"
depends = ["deps:app-server", "deps:tui"]

[tasks."deps:app-server"]
description = "Install dependencies for App Server source modules imported by the TUI"
dir = "../app-server"
run = "bun install --frozen-lockfile"

[tasks."deps:tui"]
description = "Install terminal client dependencies from the committed lockfile"
run = "bun install --frozen-lockfile"

[tasks.fmt]
description = "Format TypeScript, JSON, and Markdown"
depends = ["deps"]
run = "bun run prettier --write ."

[tasks."fmt:check"]
description = "Fail if sources are not Prettier-clean"
depends = ["deps"]
run = "bun run prettier --check ."

[tasks.lint]
description = "Run semantic lint and ATC invariants"
depends = ["deps"]
run = "bun run oxlint --report-unused-disable-directives --deny-warnings"

[tasks.typecheck]
description = "Strict TypeScript type check"
depends = ["deps"]
run = "bun run tsc --noEmit"

[tasks.test]
description = "Run terminal client tests"
depends = ["deps"]
run = "bun --bun vitest run"
